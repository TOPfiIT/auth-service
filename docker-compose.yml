services:
  postgres:
    image: postgres:15-alpine
    container_name: auth_postgres
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./config:/config

  redis:
    image: redis:7-alpine
    container_name: auth_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./config:/config
    environment:
      - CONFIG_PATH=/config/local.yaml

  auth-service:
    image: acyushka/vcj-auth-service:latest
    ports:
      - "8087:8080"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./config:/app/config
    environment:
      - GIN_MODE=release
      - CONFIG_PATH=/app/config/local.yaml
    restart: on-failure

volumes:
  postgres_data:
  redis_data:
